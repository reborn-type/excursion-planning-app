{% extends 'main/base.html' %}
{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 text-center">
        <div class="card shadow-sm p-4">
            <h3 class="text-danger mb-3">Удаление элемента</h3>
            <p>Вы действительно хотите удалить «<strong>{{ name }}</strong>»?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Да, удалить</button>
                <a href="{% url cancel_url %}" class="btn btn-secondary w-100">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
