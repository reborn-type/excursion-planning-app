{% extends 'main/base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-3">Вход в систему</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Введите Ваш ID или admin:</label>
                        {{ form.login_input }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Ещё нет ID? <a href="{% url 'main:register' %}">Зарегистрируйтесь</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
